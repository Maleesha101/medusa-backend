name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET_KEY: ci-only-signing-secret-change-before-deployment-0001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Apply migrations to a clean database
        run: alembic upgrade head
      - name: Run tests
        run: pytest
