name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET_KEY: ci-only-signing-secret-change-before-deployment-0001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Apply migrations to a clean database
        run: alembic upgrade head
      - name: Run tests
        run: pytest

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2.0"
      - name: Scan application code
        run: bandit -r app -ll -ii -f json -o bandit-report.json
      - name: Upload Bandit JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3.0"
      - name: Audit installed environment
        run: pip-audit --format=json --output=pip-audit-report.json
      - name: Upload pip-audit JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-vulnerability-report
          path: pip-audit-report.json
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan repository for secrets
        run: gitleaks dir . --report-format json --report-path gitleaks-report.json --redact --exit-code 1
      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secret-scan-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
